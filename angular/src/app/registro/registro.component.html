<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <section class="background-radial-gradient overflow-hidden">
        <div class="container px-4 py-5 px-md-5 text-center text-lg-start my-5">
            <div class="row gx-lg-5 align-items-center mb-5">
            
        
            <div class="col-lg-6 mb-5 mb-lg-0 position-relative">
                <div id="radius-shape-1" class="position-absolute rounded-circle shadow-5-strong"></div>
                <div id="radius-shape-2" class="position-absolute shadow-5-strong"></div>
        
                <div class="card bg-glass">
                    <div class="card-body px-4 py-5 px-md-5">
                    <form (ngSubmit)="registroUsuario()">
                        <!-- Casilla de email -->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="email" name="email" class="form-control" placeholder="Correo electronico" [(ngModel)]="usuario.email"/>
                        </div>
                        <!-- Casilla de usuario -->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <input type="text" name="nombre" class="form-control" placeholder="nombre usuario" [(ngModel)]="usuario.nombre"/>
                        </div>
                    <!-- casilla de contraseña -->
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="password" name="password" class="form-control" placeholder="Contraseña" [(ngModel)]="usuario.password"/>
                    </div>
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="file" name="foto" accept="image/*" class="form-control" [(ngModel)]="usuario.foto"/>
                    </div>
                    <!-- Submit button -->
                    <div class="d-grid gap-2">
                        <input class="btn" type="submit" value="Registrarse">
                    </div>
                    </form>
                    <div class="d-grid gap-2">
                        <a [routerLink]="['/inicio-sesion']">¿Ya tienes una cuenta?</a>
                    </div>
                    
                </div>
                </div>
            </div>
            <div class="col-lg-6 mb-5 mb-lg-0" style="z-index: 10">
                <h1 class="my-5 display-5 fw-bold ls-tight" style="color: hsl(218, 81%, 95%)">
                    Bienvenido 
                    <br/>
                    <span style="color: hsl(218, 81%, 75%)">A gaming home</span>
                </h1>
                <p class="mb-4 opacity-70" style="color: hsl(218, 81%, 85%)">
                    Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                    Temporibus, expedita iusto veniam atque, magni tempora mollitia
                    dolorum consequatur nulla, neque debitis eos reprehenderit quasi
                    ab ipsum nisi dolorem modi. Quos?
                </p>
            </div>
            </div>
        </div>
        </section>
</body>
</html>
