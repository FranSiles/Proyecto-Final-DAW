          <div class="collapse navbar-collapse" id="navbarSupportedContent">

            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>

    <div class="container">
      <div class="row">
        <div *ngFor="let juego of juegos" style="width: 20rem;" class="col-md-4 mb-4">
          <div class="card h-100">
            <img [src]="'http://localhost:80/' + juego.imagen" id="imagenes" class="card-img-top" alt="{{juego.nombre}}">
            <div class="card-body">
              <h5 class="card-title">{{juego.nombre}}</h5>
              <p class="card-text">{{juego.descripcion}}</p>
              <button (click)="enviarId(juego.codJuego!)"  class="btn btn-primary">ver más</button>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
