<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>perfil</title>
</head>
<body>
    <div>
        
    <section id="seccion">
            <button type="button" (click)="volver()" class="btn btn-primary">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <img [src]="'http://localhost:80/' + usuario.foto" alt="avatar" class="rounded-circle img-fluid" style="width: 150px;">
                        <h5 class="my-3">{{usuario.nomUsuario!}}</h5>
                        <hr>
                        <h5>subir nueva imagen</h5>
                        <form (ngSubmit)="cambiarfoto()" method="POST" enctype="multipart/form-data">
                            <div data-mdb-input-init class="form-control-sm">
                                <input type="file" name="foto" accept="image/*" class="form-control" (change)="onFileSelected($event)"/>
                            </div>
                            <input class="btn btn-primary" type="submit" value="subir">
                        </form>
                    </div>
                </div>
                </div>
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                    <div class="row">
                    <div class="col-sm-3">
                        <p class="mb-0">Email</p>
                    </div>
                    <div class="col-sm-9">
                        <p class="text-muted mb-0">{{usuario.email!}}</p>
                    </div>
                    </div>
                    <hr>
                    <div class="row">
                    <div class="col-sm-3">
                        <p class="mb-0">Nombre usuario</p>
                    </div>
                    <div class="col-sm-9">
                        <p class="text-muted mb-0">{{usuario.nomUsuario!}}</p>
                    </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-sm-3">
                            <p class="mb-0">Eliminar usuario</p>
                        </div>
                        <div class="col-sm-9">
                            <button  class="btn btn-danger" (click)="eliminarId(usuario.codUsuario!)">Eliminar usuario</button>
                        </div>
                        </div>
                    <hr>
                    <div class="row">
                        <div class="col-sm-3">
                            <p class="mb-0">modificar usuario</p>
                        </div>
                        <div class="col-sm-9">
                            <button  class="btn btn-primary" [routerLink]="['/modificarusuario']">modificar usuario</button>
                        </div>
                        </div>
                </div>
                </div>
            </div>
            </div>
        </div>
        </section>
        <section>
            <h1 class="text-center">Tus comentarios</h1>
            <div class="d-flex align-items-center justify-content-center">
                <div class="card w-50 mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                        <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                    </div>
                </div>
        </div>
        </section>
        <footer id="pie_de_pagina" style="background-color: aqua; text-align: center;">
            <p>pie de pagina</p>
        </footer>
    </div>
</body>
</html>
